spring:
  datasource:
    url: ${DIGITACOURSE_TEST_DB_URL:jdbc:postgresql://127.0.0.1:5432/digitacourse_test}
    username: ${DIGITACOURSE_TEST_DB_USER:postgres}
    password: ${DIGITACOURSE_TEST_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    clean-disabled: true

app:
  jwt:
    secret: ${DIGITACOURSE_TEST_JWT_SECRET:digitacourse-test-secret-key-with-at-least-32-characters}
    expiration-hours: 2
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    org.flywaydb: WARN
    org.hibernate.SQL: WARN
