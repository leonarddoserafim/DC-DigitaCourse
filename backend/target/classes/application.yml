spring:
  application:
    name: digitacourse-api
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DIGITACOURSE_DB_URL:jdbc:postgresql://127.0.0.1:5432/digitacourse}
    username: ${DIGITACOURSE_DB_USER:postgres}
    password: ${DIGITACOURSE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    encoding: UTF-8
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never

app:
  jwt:
    secret: ${DIGITACOURSE_JWT_SECRET:digitacourse-local-dev-secret-key-change-before-production-2026}
    expiration-hours: 168
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
